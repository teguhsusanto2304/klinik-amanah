spring.application.name=klinikamanah-api
server.port=8000
server.address=192.168.1.7

# MySQL: database dibuat otomatis bila belum ada; sesi koneksi dipaksa UTC agar kolom TIMESTAMP disimpan dalam UTC.
spring.datasource.url=jdbc:mysql://localhost:3306/klinikamanah_db?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Skema dikelola Flyway. db/demo berisi data contoh (klinik, user kasir, pasien, kunjungan hari ini);
# hapus lokasi tersebut di produksi.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.ignore-migration-patterns=*:missing

# Zona waktu aplikasi untuk menentukan "hari ini" (tanggal tagihan, nomor dokumen, filter tanggal).
# Disamakan dengan aplikasi Laravel (config/app.php: UTC).
app.timezone=UTC

# Rute yang tidak dikenal langsung dijawab 404 JSON.
spring.web.resources.add-mappings=false
